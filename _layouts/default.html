<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} — 5C4T3R</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
        *, *:before, *:after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- TYPE SCALE ---
           Prose is proportional (Inter); chrome, headings and code stay mono. */
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --ink: #1a1a1a;
            --ink-muted: #5c5c5c;
            --paper: #f7f6f3;
            --rule: #e0ddd9;
            --measure: 760px;
        }

        /* neutralize minima theme completely */
        .site-header, .site-footer, .site-nav, .wrapper { display: none !important; }
        .navbar { border-top: none !important; border-bottom: none !important; }
        .footer { border-top: none !important; border-bottom: none !important; }
        body { border: none !important; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #f7f6f3;
            border-bottom: 1px solid #e0ddd9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2.5rem;
            height: 60px;
            min-height: 60px;
        }

        .navbar ul,
        .navbar-nav {
            list-style: none;
            margin: 0 !important;
            padding: 0 !important;
        }


        .navbar-right {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
            position: relative;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 0.1rem;
        }

        .navbar-nav a {
            color: #555555;
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 0.35rem 0.65rem;
            border-radius: 3px;
            transition: all 0.15s ease;
            display: block;
            letter-spacing: 0.01em;
        }

        .navbar-nav a:hover {
            color: #1a1a1a;
            background: rgba(0,0,0,0.06);
        }

        .navbar-nav a.active {
            color: #1a1a1a;
            font-weight: 700;
        }

        .navbar-divider {
            color: #cccccc;
            font-size: 13px;
            padding: 0 0.1rem;
            user-select: none;
        }

        /* social icons */
        .navbar-social {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            position: absolute;
            right: 0;
        }

        .navbar-social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 3px;
            color: #555555;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .navbar-social a:hover {
            background: rgba(0,0,0,0.06);
            color: #1a1a1a;
        }

        .navbar-social svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        /* --- HAMBURGER --- */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 6px;
            border: none;
            background: none;
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: #1a1a1a;
            transition: all 0.3s ease;
        }

        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* --- MOBILE MENU --- */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            background: #f7f6f3;
            border-bottom: 2px solid #1a1a1a;
            padding: 1rem 2rem;
            z-index: 99;
            flex-direction: column;
            gap: 0.15rem;
        }

        .mobile-menu.open { display: flex; }

        .mobile-menu a {
            color: #555555;
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 14px;
            padding: 0.55rem 0.75rem;
            border-radius: 3px;
            transition: all 0.15s ease;
        }

        .mobile-menu a:hover,
        .mobile-menu a.active {
            color: #1a1a1a;
            background: rgba(0,0,0,0.06);
            font-weight: 700;
        }

        /* --- MAIN CONTENT --- */
        .page-wrapper {
            flex: 1;
            width: 100%;
            max-width: var(--measure);
            margin: 0 auto;
            padding: 3.5rem 2rem 2rem;
        }

        a {
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
            text-decoration-color: #b8b4ae;
            font-weight: 500;
            transition: text-decoration-color 0.15s ease;
        }

        a:hover { text-decoration-color: var(--ink); }

        h1, h2, h3, h4 {
            font-family: var(--font-mono);
            color: var(--ink);
            font-weight: 700;
            line-height: 1.3;
            margin-top: 3rem;
            margin-bottom: 1rem;
        }

        h1 { font-size: 2rem; margin-top: 0; letter-spacing: -0.03em; }
        h2 { font-size: 1.3rem; letter-spacing: -0.01em; }
        h3 { font-size: 1.1rem; }
        h4 {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--ink-muted);
        }

        h1 + p, h2 + p, h3 + p, h4 + p { margin-top: 0; }

        p {
            margin-bottom: 1.5rem;
            color: var(--ink);
            line-height: 1.7;
        }

        ul, ol {
            padding-left: 1.4rem;
            margin-bottom: 1.5rem;
        }

        li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        li::marker { color: #a8a49e; }

        strong { font-weight: 600; }

        hr {
            border: none;
            border-top: 1px solid var(--rule);
            margin: 3rem 0;
        }

        /* --- CODE --- */
        .code-container {
            position: relative;
            margin: 2rem 0;
        }

        pre {
            background: #eeecea;
            border: 1px solid #d0ceca;
            padding: 1.5rem;
            padding-top: 3rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.65;
            border-radius: 3px;
        }

        code {
            font-family: var(--font-mono);
            background: #eeecea;
            padding: 0.15rem 0.4rem;
            border-radius: 2px;
            font-size: 0.875em;
            color: var(--ink);
        }

        pre code { background: none; padding: 0; font-size: inherit; }

        .copy-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #1a1a1a;
            color: #f7f6f3;
            border: none;
            border-radius: 3px;
            padding: 0.3rem 0.65rem;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            letter-spacing: 0.03em;
        }

        .copy-button:hover { background: #333333; }

        /* --- BLOCKQUOTE --- */
        blockquote {
            border-left: 3px solid var(--ink);
            padding-left: 1.5rem;
            margin: 2rem 0;
            color: var(--ink-muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        blockquote p:last-child { margin-bottom: 0; }

        /* --- TABLE --- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            margin: 2rem 0;
        }

        th {
            padding: 10px 12px;
            border-bottom: 2px solid var(--ink);
            text-align: left;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 11px;
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #d0ceca;
            color: var(--ink);
            line-height: 1.5;
        }

        tr:hover td { background: #eeecea; }

        /* --- FOOTER --- */
        .footer {
            border-top: 1px solid var(--rule);
            padding: 1.25rem 2.5rem;
            margin-top: 4rem;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #888888;
        }

        .footer p { margin-bottom: 0; }

        .footer a {
            color: #888888;
            text-decoration: none;
            font-weight: 400;
        }

        .footer a:hover { color: #1a1a1a; opacity: 1; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .navbar-right { display: none; }
            .hamburger { display: flex; }

            body { font-size: 16px; }

            .page-wrapper { padding: 2.5rem 1.25rem 1.5rem; }

            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.2rem; margin-top: 2.5rem; }
            h3 { font-size: 1.05rem; }

            pre { padding: 1rem; padding-top: 2.75rem; font-size: 12.5px; }

            .footer {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
                padding: 0.9rem 1rem;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Copy button for code blocks
            document.querySelectorAll('pre').forEach(pre => {
                if (pre.parentNode.classList.contains('code-container')) return;
                const container = document.createElement('div');
                container.className = 'code-container';
                const btn = document.createElement('button');
                btn.className = 'copy-button';
                btn.textContent = 'Copy';
                pre.parentNode.insertBefore(container, pre);
                container.appendChild(pre);
                container.appendChild(btn);
                btn.addEventListener('click', () => {
                    const code = pre.querySelector('code');
                    navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(() => {
                        btn.textContent = 'Copied!';
                        setTimeout(() => btn.textContent = 'Copy', 2000);
                    });
                });
            });

            // Hamburger menu
            const hamburger = document.getElementById('hamburger');
            const mobileMenu = document.getElementById('mobileMenu');
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('open');
                mobileMenu.classList.toggle('open');
            });

            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('open');
                    mobileMenu.classList.remove('open');
                });
            });
        });
    </script>
